name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# A new push to a PR supersedes its running checks; main always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"           # matches the node:22-alpine runtime images
  HELM_VERSION: v3.16.4
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Image vulnerability scanning is BLOCKING: a fixable HIGH/CRITICAL finding fails the image job.
  # The advisory backlog was cleared by the Nov 2026 upgrades. To accept a specific finding, add it
  # to .trivyignore with a reason rather than setting this back to "0". See docs/ci.md.
  TRIVY_EXIT_CODE: "1"

jobs:
  node:
    name: Lint, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci fails if package-lock.json and the package.json files disagree.
      - run: npm ci

      # Known vulnerabilities in dependencies. Blocks on high and critical; Dependabot proposes the
      # updates. (Trivy also scans the built images.)
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # Builds the API, worker and frontend (tsc / next build); this is also the type-check.
      - name: Build
        run: npm run build

      # tests/helm renders the chart and checks the rendered objects (CI fails if helm is missing).
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      # Runs every package's tests, then the cross-package checks (dashboards vs. metrics, rendered chart).
      # A package that finds no tests fails rather than passing silently.
      - name: Test
        run: npm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # postgres:16-alpine (16.16), pinned by digest; same major version as docker-compose.yml.
        image: postgres@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
        env:
          POSTGRES_USER: openpm
          POSTGRES_PASSWORD: openpm
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Only for rate limits shared across API instances (rateLimitShared.int.test.ts); the other
      # tests fake Redis. redis:7-alpine (7.4), pinned by digest.
      redis:
        image: redis@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Creates a throwaway database, runs every migration up, down to empty and up again, then drives
      # the real API (routes, auth, SQL) against it: tenant isolation, roles, account flows, rate limits.
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://openpm:openpm@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/0

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The real API, Postgres and Redis (Compose builds the API image and runs migrations first).
      # The e2e overlay lifts the per-address rate limit for the test client (see the file).
      - name: Start the API
        run: |
          # Compose has no default JWT secret; later steps (logs) read the file too, so export it to them.
          export JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          export DATABASE_APP_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$DATABASE_APP_PASSWORD"
          echo "DATABASE_APP_PASSWORD=$DATABASE_APP_PASSWORD" >> "$GITHUB_ENV"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build api
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/health && exit 0; sleep 2; done
          echo "::error::API did not become healthy"; docker compose logs api migrate; exit 1

      - name: Install Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # Core journey, accessibility (axe, WCAG 2.1 AA) and phone layout; starts the frontend dev server.
      - name: Browser tests
        working-directory: apps/frontend
        run: npx playwright test

      - name: API logs
        if: failure()
        run: docker compose logs --tail=200 api

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      # --strict turns lint warnings into failures. Each variant exercises different template branches.
      # The chart has no default credentials (it refuses to render without them), so the non-production
      # variants get throwaway ones; production reads an existing Secret.
      - name: Lint (defaults, production values, monitoring on)
        run: |
          CREDS="--set secrets.jwtSecret=ci-only-not-a-real-secret-0123456789abcdef --set secrets.postgres.password=ci --set secrets.redis.password=ci"
          helm lint --strict helm/openpm $CREDS
          helm lint --strict helm/openpm -f helm/openpm/values.prod.yaml
          helm lint --strict helm/openpm $CREDS --set serviceMonitor.enabled=true --set grafana.dashboards.enabled=true --set prometheusRule.enabled=true

      # Lint doesn't catch everything; actually render each variant.
      - name: Render
        run: |
          CREDS="--set secrets.jwtSecret=ci-only-not-a-real-secret-0123456789abcdef --set secrets.postgres.password=ci --set secrets.redis.password=ci"
          helm template openpm helm/openpm $CREDS > /dev/null
          helm template openpm helm/openpm -f helm/openpm/values.prod.yaml > /dev/null
          helm template openpm helm/openpm $CREDS \
            --set serviceMonitor.enabled=true --set serviceMonitor.namespace=monitoring \
            --set grafana.dashboards.enabled=true \
            --set prometheusRule.enabled=true --set prometheusRule.namespace=monitoring > /dev/null

      # Syntax-check the alert rules, then run their unit tests (series in, firing alerts out).
      # promtool comes from the Prometheus image, pinned by digest (v3.5.0).
      - name: Alert rules (promtool check + test)
        run: |
          PROMTOOL_IMAGE=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          docker run --rm --entrypoint promtool -v "$PWD:/w:ro" "$PROMTOOL_IMAGE" \
            check rules /w/helm/openpm/alerts/openpm.rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/w:ro" "$PROMTOOL_IMAGE" \
            test rules /w/tests/observability/alerts.promtool.yaml

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false

      # Pinned version, verified against the published checksum before it is executed.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A broken config can silently detect nothing (this repo's did: it replaced the built-in rules).
      # Prove, on every run, that it still reports known fake secrets. The values are assembled from
      # fragments so this file itself doesn't look like a leak to the scanner.
      - name: Check the config still detects secrets
        run: |
          mkdir "$RUNNER_TEMP/canary"
          kind=RSA
          printf -- '-----BEGIN %s PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xfn/ygWyF8PbnGy0AHB7MaeEAMPLEEXAMPLE\n-----END %s PRIVATE KEY-----\n' \
            "$kind" "$kind" > "$RUNNER_TEMP/canary/key.pem"
          scheme=postgresql
          printf "const url = '%s://admin:Tr0ub4dor-9x-real@db.prod.example.com:5432/app';\n" "$scheme" > "$RUNNER_TEMP/canary/db.ts"
          if gitleaks detect --no-git --source "$RUNNER_TEMP/canary" --config .gitleaks.toml --no-banner > /dev/null 2>&1; then
            echo "::error::gitleaks reported nothing for files containing known fake secrets: the configuration is not detecting"
            exit 1
          fi
          echo "Canary detected as expected."

      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only (nothing is pushed). Proves the Dockerfile builds from a clean checkout.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: openpm-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openpm-${{ matrix.app }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only report what has a fix available
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
