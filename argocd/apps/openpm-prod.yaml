apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpm-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/vxrdhxn/OpenPM.git'
    targetRevision: HEAD
    path: helm/openpm
    helm:
      valueFiles:
        - values.yaml
        - values.prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openpm-prod
  # Manual sync on purpose: production changes only when someone syncs a reviewed revision (in the
  # UI or `argocd app sync openpm-prod`). Automated sync with prune would deploy every commit on main
  # the moment it lands, and delete whatever a bad commit removes. Dev (openpm-dev.yaml) syncs
  # automatically. For release pinning, set targetRevision to a tag instead of HEAD.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
