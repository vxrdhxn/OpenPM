apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpm-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/vxrdhxn/OpenPM.git'
    # The release's deploy tag, never a branch: the chart and values.prod.yaml (with the image
    # digests) come from one commit, so production never runs a chart from main with images from an
    # older release (docs/releasing.md). The release workflow tags its "deploy: vX.Y.Z to production"
    # commit deploy/vX.Y.Z and sets this line in the same commit; keep the "# deploy tag" marker, the
    # workflow finds the line by it.
    targetRevision: deploy/v0.2.0 # deploy tag
    path: helm/openpm
    helm:
      valueFiles:
        - values.yaml
        - values.prod.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openpm-prod
  # Manual sync on purpose: production changes only when someone syncs a reviewed revision (in the
  # UI or `argocd app sync openpm-prod`). Automated sync with prune would deploy every commit on main
  # the moment it lands, and delete whatever a bad commit removes. Dev (openpm-dev.yaml) syncs
  # automatically.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
