# Prometheus config for docker-compose.monitoring.yml (local only).
#
# Labels mirror what the Helm chart's ServiceMonitors produce, so the shipped dashboards and alert rules
# work unchanged: job "<release>-api" / "<release>-worker", a namespace label, and a pod label per target.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/openpm.rules.yaml

scrape_configs:
  - job_name: openpm-api
    # Every container with the openpm-api-instances alias (one, or two with docker-compose.scale.yml).
    dns_sd_configs:
      - names: [openpm-api-instances]
        type: A
        port: 3000
        refresh_interval: 15s
    relabel_configs:
      - target_label: namespace
        replacement: compose
      - source_labels: [__address__]
        target_label: pod

  - job_name: openpm-worker
    static_configs:
      - targets: ['worker:9100']
    relabel_configs:
      - target_label: namespace
        replacement: compose
      - source_labels: [__address__]
        target_label: pod
