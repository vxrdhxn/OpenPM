# Optional: local S3-compatible storage (MinIO) for task attachments.
#
#   docker compose -f docker-compose.yml -f docker-compose.storage.yml up
#
# Image: MinIO no longer publishes images to Docker Hub or quay.io (both now refuse the pull), so this
# uses Chainguard's maintained MinIO build. That image also ships `mc` and a shell, so one image serves
# both the server and the bucket-init step. Chainguard's free tier only publishes `latest`; for
# reproducible builds pin MINIO_IMAGE to a digest, e.g.
#   MINIO_IMAGE=cgr.dev/chainguard/minio@sha256:96b6cf3e14084d3427ec46de10c2873af61b945ad9272eec266cfc8df551cba5
# (the digest this file was last verified with). Any image that provides `minio`, `mc` and `sh` works.
# These credentials are for local development only.

services:
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: openpm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-openpm-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-openpm-dev-secret}
      # Browsers PUT/GET presigned URLs directly, so the frontend origin must be allowed.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has no preconfigured `mc` alias, so create a throwaway one (in /tmp: the user's home may not be writable).
      test:
        - CMD-SHELL
        - mc --config-dir /tmp/mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc --config-dir /tmp/mc ready local
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-openpm-attachments}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-openpm-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-openpm-dev-secret}
    entrypoint: >
      /bin/sh -c "
      mc --config-dir /tmp/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc --config-dir /tmp/mc mb --ignore-existing local/$$S3_BUCKET"

  api:
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET=${S3_BUCKET:-openpm-attachments}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-openpm-dev}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-openpm-dev-secret}
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
