apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpm.worker.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "openpm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        # Roll the pods when their config or secrets change; env vars are only read at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "openpm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "openpm.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "openpm.image" (dict "image" .Values.worker.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: LOG_LEVEL
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: APP_URL
            - name: EMAIL_FROM_ADDRESS
              value: {{ .Values.email.fromAddress | quote }}
            {{- if or .Values.secrets.resendApiKey .Values.secrets.existingSecret }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.secretName" . }}
                  key: RESEND_API_KEY
                  optional: true
            {{- end }}
            {{- if .Values.worker.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.worker.metrics.port | default 9100 | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.secretName" . }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.secretName" . }}
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.secretName" . }}
                  key: JWT_SECRET
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.worker.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metrics.port | default 9100 }}
              protocol: TCP
          {{- end }}
          # /healthz on the metrics server: the process is up and its event loop answers. It does not
          # check Postgres or Redis, so an outage never restarts every worker (they retry jobs instead).
          # The server listens whether or not metrics are scraped.
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.worker.metrics.port | default 9100 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
