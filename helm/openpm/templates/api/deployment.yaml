apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpm.api.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openpm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Roll the pods when their config or secrets change; env vars are only read at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "openpm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "openpm.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.migrations.enabled }}
      # Apply pending database migrations before the API starts (same image, same runner as
      # `npm run migrate`). Safe with several replicas: the runner holds an advisory lock and skips
      # what is already applied. If the database is not reachable yet, this container fails and the
      # kubelet retries it with backoff. Works the same under `helm install` and ArgoCD.
      initContainers:
        - name: migrate
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "openpm.image" (dict "image" .Values.api.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          command: ["node", "apps/api/dist/db/migrate.js", "up"]
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.fullname" . }}-secrets
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "openpm.image" (dict "image" .Values.api.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port | default 3000 }}
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: LOG_LEVEL
            - name: PORT
              value: {{ .Values.api.port | default 3000 | quote }}
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.fullname" . }}-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpm.fullname" . }}-secrets
                  key: JWT_SECRET
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port | default 3000 }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          # Liveness checks only the process: a database or Redis outage must not restart every pod.
          # Readiness uses /health (503 without the database; Redis down is "degraded", still ready).
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.api.port | default 3000 }}
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port | default 3000 }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
