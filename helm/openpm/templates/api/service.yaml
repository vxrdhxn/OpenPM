apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpm.api.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port | default 3000 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openpm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
