{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openpm.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .backend "api" }}{{ include "openpm.api.fullname" $ }}{{ else }}{{ include "openpm.frontend.fullname" $ }}{{ end }}
                port:
                  number: {{ if eq .backend "api" }}{{ $.Values.api.port | default 3000 }}{{ else }}{{ $.Values.frontend.port | default 3001 }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
