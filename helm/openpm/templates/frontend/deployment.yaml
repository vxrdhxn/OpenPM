apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpm.frontend.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.frontend.hpa.enabled }}
  replicas: {{ .Values.frontend.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openpm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        # Roll the pods when their config or secrets change; env vars are only read at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "openpm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "openpm.imagePullSecrets" . | nindent 6 }}
      {{- include "openpm.topologySpread" (dict "root" $ "component" "frontend") | nindent 6 }}
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          {{- with .Values.securityContext.container }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "openpm.image" (dict "image" .Values.frontend.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port | default 3001 }}
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openpm.fullname" . }}-config
                  key: NODE_ENV
            - name: PORT
              value: {{ .Values.frontend.port | default 3001 | quote }}
            {{- with .Values.frontend.cspConnectSrc }}
            - name: CSP_CONNECT_SRC
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port | default 3001 }}
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port | default 3001 }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/frontend/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
