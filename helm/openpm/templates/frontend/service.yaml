apiVersion: v1
kind: Service
metadata:
  name: {{ include "openpm.frontend.fullname" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.port | default 3001 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openpm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
