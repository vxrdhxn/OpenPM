apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openpm.fullname" . }}-config
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}
  CORS_ORIGIN: {{ .Values.api.corsOrigin | default (printf "http://%s" .Values.global.domain) | quote }}
  {{- with .Values.api.cookieDomain }}
  COOKIE_DOMAIN: {{ . | quote }}
  {{- end }}
  
  {{- $proto := "http" }}
  {{- if .Values.ingress.tls }}
    {{- $proto = "https" }}
  {{- end }}
  # Frontend base URL; the worker uses it to build links in emails (e.g. invites).
  APP_URL: {{ printf "%s://%s" $proto .Values.global.domain | quote }}
  # No NEXT_PUBLIC_* here: Next.js inlines those at image build time, so runtime values have no effect.
  # The frontend calls the API on its own origin (/api, /ws), which the Ingress routes to the API.
  PORT: {{ .Values.frontend.port | default 3001 | quote }}
