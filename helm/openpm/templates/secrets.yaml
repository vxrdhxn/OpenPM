{{- /*
The chart ships no credentials. Either set secrets.existingSecret to a Secret you create (the usual
choice for GitOps: secrets stay out of Git), or set the values below at install time
(--set / a values file that is not committed). Rendering fails rather than deploy a guessable key.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $published := list
  "change_me_to_something_super_secret_and_long_enough_32_chars"
  "super_secret_development_key_change_me_in_prod_123"
  "some_super_secret_jwt_key_that_is_long_enough" }}
{{- $jwt := .Values.secrets.jwtSecret | default "" }}
{{- if or (lt (len $jwt) 32) (has $jwt $published) }}
{{- fail "secrets.jwtSecret must be set to a random value of at least 32 characters (openssl rand -hex 32), or set secrets.existingSecret. See docs/deploying.md." }}
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.secrets.postgres.password) }}
{{- fail "secrets.postgres.password is required when postgres.enabled=true (or set secrets.existingSecret)." }}
{{- end }}
{{- if and .Values.redis.enabled (not .Values.secrets.redis.password) }}
{{- fail "secrets.redis.password is required when redis.enabled=true (or set secrets.existingSecret)." }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.url) }}
{{- fail "externalDatabase.url is required when postgres.enabled=false (or set secrets.existingSecret)." }}
{{- end }}
{{- if and (not .Values.redis.enabled) (not .Values.externalRedis.url) }}
{{- fail "externalRedis.url is required when redis.enabled=false (or set secrets.existingSecret)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openpm.secretName" . }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $jwt | b64enc | quote }}
  {{- if .Values.secrets.resendApiKey }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | b64enc | quote }}
  {{- end }}

  {{- $pg := .Values.secrets.postgres }}
  {{- $host := include "openpm.postgres.fullname" . }}
  {{- if and .Values.postgres.enabled $pg.appPassword }}
  {{- if eq $pg.appUsername $pg.username }}
  {{- fail "secrets.postgres.appUsername must differ from secrets.postgres.username (the owner)." }}
  {{- end }}
  # The app's own user (rows only); migrations connect as the owner and create it.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" $pg.appUsername ($pg.appPassword | urlquery) $host $pg.database | b64enc | quote }}
  DATABASE_MIGRATION_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" $pg.username ($pg.password | urlquery) $host $pg.database | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ if .Values.postgres.enabled }}
    {{- printf "postgresql://%s:%s@%s:5432/%s" $pg.username ($pg.password | urlquery) $host $pg.database | b64enc | quote }}
  {{- else }}
    {{- .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
  {{- end }}

  REDIS_URL: {{ if .Values.redis.enabled }}
    {{- printf "redis://:%s@%s:6379/0" (.Values.secrets.redis.password | urlquery) (include "openpm.redis.fullname" .) | b64enc | quote }}
  {{- else }}
    {{- .Values.externalRedis.url | b64enc | quote }}
  {{- end }}

  # Self-hosted Postgres credentials (if enabled)
  {{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.secrets.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgres.database | b64enc | quote }}
  {{- end }}

  # Self-hosted Redis credentials (if enabled)
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | b64enc | quote }}
  {{- end }}
{{- end }}
