{{- if .Values.grafana.dashboards.enabled }}
# One ConfigMap holding every dashboard in dashboards/*.json. Grafana's dashboard sidecar loads
# ConfigMaps carrying the configured label (see grafana.dashboards.labels).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openpm.fullname" . }}-dashboards
  {{- if .Values.grafana.dashboards.namespace }}
  namespace: {{ .Values.grafana.dashboards.namespace }}
  {{- end }}
  labels:
    {{- include "openpm.labels" . | nindent 4 }}
    {{- with .Values.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafana.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{ (.Files.Glob "dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
