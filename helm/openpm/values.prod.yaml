# Production overrides for openpm
global:
  environment: "production"
  domain: "app.openpm.com"

# For production, we assume managed external databases are used
postgres:
  enabled: false

redis:
  enabled: false

# Configure external production database and cache connections
# Override these secrets during helm deployment (e.g. --set externalDatabase.url=$DB_URL)
externalDatabase:
  url: "postgresql://openpm_prod_user:SECRET_PASSWORD_HERE@postgres-prod-instance.internal:5432/openpm_prod"
externalRedis:
  url: "redis://:SECRET_REDIS_PASS_HERE@redis-prod-instance.internal:6379/0"

# Image repository, tag and digest are set by the release workflow's "deploy: vX.Y.Z to production"
# pull request (docs/releasing.md). Do not edit them by hand.
api:
  replicaCount: 3
  image:
    repository: "ghcr.io/vxrdhxn/openpm-api"
    tag: "0.1.0"
    digest: ""
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

worker:
  replicaCount: 2
  image:
    repository: "ghcr.io/vxrdhxn/openpm-worker"
    tag: "0.1.0"
    digest: ""
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

frontend:
  replicaCount: 3
  image:
    repository: "ghcr.io/vxrdhxn/openpm-frontend"
    tag: "0.1.0"
    digest: ""
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  # Set className to your controller's IngressClass (empty = the cluster default). HTTP->HTTPS
  # redirects are configured on the controller (e.g. Traefik entryPoint redirection), or with a
  # controller annotation such as nginx.ingress.kubernetes.io/ssl-redirect: "true".
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "app.openpm.com"
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /api
          pathType: Prefix
          backend: api
        - path: /ws
          pathType: Prefix
          backend: api
  tls:
    - secretName: openpm-tls-prod
      hosts:
        - "app.openpm.com"

# Enable Prometheus ServiceMonitor in production
serviceMonitor:
  enabled: true
