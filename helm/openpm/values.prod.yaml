# Production overrides for openpm
global:
  environment: "production"
  domain: "app.openpm.com"

# For production, we assume managed external databases are used
postgres:
  enabled: false

redis:
  enabled: false

# Credentials come from a Secret created in the openpm-prod namespace before the first sync, never
# from Git: JWT_SECRET, DATABASE_URL and REDIS_URL (the managed database and cache), and optionally
# RESEND_API_KEY. docs/deploying.md shows how to create it.
secrets:
  existingSecret: "openpm-secrets"

# Image repository, tag and digest are set by the release workflow's "deploy: vX.Y.Z to production"
# pull request (docs/releasing.md). Do not edit them by hand.
api:
  replicaCount: 3
  image:
    repository: "ghcr.io/vxrdhxn/openpm-api"
    tag: "0.2.0"
    digest: "sha256:32acdad93af7cc310c17ab00ca6da57ae765bfc13b3363cc3001acaf842e70f5"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

worker:
  replicaCount: 2
  image:
    repository: "ghcr.io/vxrdhxn/openpm-worker"
    tag: "0.2.0"
    digest: "sha256:6caa5b6590fd55c262d5b8038a0fa00f17e00337ab9c84b780c2622612e3f398"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

frontend:
  replicaCount: 3
  image:
    repository: "ghcr.io/vxrdhxn/openpm-frontend"
    tag: "0.2.0"
    digest: "sha256:4e148df0e1529ae04dbba9681fa16a25eeed0a98222fe9a2da79a68e2f6e53b7"
    pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  # Set className to your controller's IngressClass (empty = the cluster default). HTTP->HTTPS
  # redirects are configured on the controller (e.g. Traefik entryPoint redirection), or with a
  # controller annotation such as nginx.ingress.kubernetes.io/ssl-redirect: "true".
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "app.openpm.com"
      paths:
        - path: /
          pathType: Prefix
          backend: frontend
        - path: /api
          pathType: Prefix
          backend: api
        - path: /ws
          pathType: Prefix
          backend: api
  tls:
    - secretName: openpm-tls-prod
      hosts:
        - "app.openpm.com"

# Enable Prometheus ServiceMonitor in production
serviceMonitor:
  enabled: true
