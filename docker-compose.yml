

services:
  postgres:
    image: postgres:16-alpine
    container_name: openpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpm}
      POSTGRES_DB: ${POSTGRES_DB:-openpm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpm} -d ${POSTGRES_DB:-openpm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openpm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-openpm}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-openpm}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: openpm-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openpm}:${POSTGRES_PASSWORD:-openpm}@postgres:5432/${POSTGRES_DB:-openpm}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-openpm}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-some_super_secret_jwt_key_that_is_long_enough}
      - PORT=3000
      - CORS_ORIGIN=http://localhost:3001
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: openpm-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openpm}:${POSTGRES_PASSWORD:-openpm}@postgres:5432/${POSTGRES_DB:-openpm}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-openpm}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-some_super_secret_jwt_key_that_is_long_enough}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: openpm-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000/ws
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
