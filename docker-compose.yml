version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: openpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpm}
      POSTGRES_DB: ${POSTGRES_DB:-openpm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpm} -d ${POSTGRES_DB:-openpm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openpm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-openpm}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-openpm}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
