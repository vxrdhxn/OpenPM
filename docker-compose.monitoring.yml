# Optional: Prometheus + Grafana with OpenPM's own alert rules and dashboards, the same files the Helm
# chart ships (helm/openpm/alerts, helm/openpm/dashboards). For trying them against real traffic locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   (add -f docker-compose.scale.yml for two API instances; Prometheus discovers both)
#
#   Prometheus: http://localhost:9090   (Alerts tab: rule state; Status > Targets: scrape health)
#   Grafana:    http://localhost:3003   (anonymous viewer access; admin login admin / admin)
#
# Local use only: Grafana allows anonymous access and both listen on all interfaces of the host.

services:
  api:
    networks:
      default:
        aliases: [openpm-api-instances]

  prometheus:
    # prom/prometheus:v3.5.0, the same digest CI uses for promtool.
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: openpm-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./helm/openpm/alerts:/etc/prometheus/rules:ro
    depends_on:
      api:
        condition: service_healthy

  grafana:
    # grafana/grafana-oss:12.1.1
    image: grafana/grafana-oss@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    container_name: openpm-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3003:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helm/openpm/dashboards:/var/lib/grafana/dashboards/openpm:ro
    depends_on:
      - prometheus
